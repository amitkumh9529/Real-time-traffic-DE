services:

  # ============================================================================
  # 1. POSTGRESQL (Hive Metastore Database Backend)
  # ============================================================================
  postgres-metastore:
    image: postgres:13.16-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: ${POSTGRES_METASTORE_DB:-metastore}
      POSTGRES_USER: ${POSTGRES_METASTORE_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_METASTORE_PASSWORD:-hive}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_METASTORE_USER:-hive} -d ${POSTGRES_METASTORE_DB:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 2. APACHE HIVE METASTORE SERVICE
  # ============================================================================
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    depends_on:
      postgres-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "false"
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./warehouse:/opt/hive/warehouse
    restart: unless-stopped

  # ============================================================================
  # 3. APACHE SPARK MASTER
  # ============================================================================
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master*.out
      "
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC port
    volumes:
      - ./warehouse:/opt/spark/warehouse
      - ./apps:/opt/spark-apps
      - ./spark-ivy:/tmp/.ivy
      - ./sql:/opt/spark-sql:ro
      - ./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # 4. APACHE SPARK WORKER
  # ============================================================================
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    hostname: spark-worker
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 2g &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out
      "
    ports:
      - "8081:8081"   # Spark Worker Web UI
      - "4040:4040"   # Spark Application Web UI
      - "10000:10000" # Spark Thrift Server Port (JDBC/ODBC for Power BI)
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./warehouse:/opt/spark/warehouse
      - ./apps:/opt/spark-apps
      - ./spark-ivy:/tmp/.ivy
      - ./sql:/opt/spark-sql:ro
      - ./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    restart: unless-stopped

  # ============================================================================
  # 5. APACHE KAFKA (KRaft Mode - No ZooKeeper)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"     # Internal Docker broker listener
      - "29092:29092"   # External host broker listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://host.docker.internal:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 6. KAFKA UI (Cluster & Message Inspection)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"   # Kafka UI accessible at http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped
